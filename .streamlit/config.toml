# Streamlit theme for the UI (P10.1). Read from the directory `streamlit run` is started
# in, so run the UI from the repository root (the Docker image copies it to /app).
# Colours are mirrored in src/beautycrawler/ui_style.py; tests/test_ui_style.py checks
# the text/accent contrast of both modes.

[theme]
baseFontSize = 16
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.1rem", "1rem", "0.9rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "full"
showWidgetBorder = true

[theme.light]
primaryColor = "#B4325A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F4F5"
textColor = "#1F1B1D"
borderColor = "#E6E0E2"
linkColor = "#B4325A"

[theme.dark]
primaryColor = "#F08BA6"
backgroundColor = "#141214"
secondaryBackgroundColor = "#211D20"
textColor = "#EEE9EB"
borderColor = "#3A3438"
linkColor = "#F08BA6"

[client]
# Hide the developer menu entries (Rerun, Settings stay) for visitors.
toolbarMode = "viewer"
